<!-- @dsCard group="Components" -->
<style>
  .ds-gc-wrap { background:#171717; padding:28px; border-radius:16px; font-family:Geist,Inter,system-ui,sans-serif; display:flex; gap:20px; flex-wrap:wrap; }
  .game-card { width:300px; background:rgba(255,255,255,0.05); border:1px solid #27272a; border-radius:16px; overflow:hidden; color:#FAFAFA; }
  .game-card .cover { height:150px; background:linear-gradient(135deg,#052e16 0%,#14532d 45%,#171717 100%); position:relative; }
  .game-card .badge { position:absolute; top:12px; left:12px; background:#9333ea; color:#fff; font:600 11px Geist,Inter,sans-serif; padding:4px 10px; border-radius:999px; }
  .game-card .status { position:absolute; top:12px; right:12px; background:rgba(0,0,0,.6); color:#22c55e; font:500 11px Geist,Inter,sans-serif; padding:4px 10px; border-radius:999px; }
  .game-card .body { padding:14px 16px 16px; }
  .game-card h4 { margin:0 0 6px; font-size:17px; font-weight:600; }
  .game-card .dt { color:#22c55e; font-size:13px; font-weight:500; margin-bottom:10px; }
  .game-card .meta { display:flex; justify-content:space-between; align-items:center; color:#a1a1aa; font-size:13px; }
  .game-card .price { color:#FAFAFA; font-weight:600; }
  .feature-card { width:260px; background:rgba(255,255,255,0.05); border:1px solid #27272a; border-radius:16px; padding:20px; color:#FAFAFA; }
  .feature-card .ico { width:40px; height:40px; border-radius:10px; background:rgba(34,197,94,.12); display:flex; align-items:center; justify-content:center; color:#22c55e; font-size:20px; margin-bottom:14px; }
  .feature-card h4 { margin:0 0 6px; font-size:16px; font-weight:600; }
  .feature-card p { margin:0; font-size:13.5px; line-height:1.5; color:#a1a1aa; }
</style>
<div class="ds-gc-wrap">
  <div class="game-card">
    <div class="cover"><span class="badge">Приключение</span><span class="status">2/5 мест</span></div>
    <div class="body">
      <h4>Башня Дракона</h4>
      <div class="dt">11 Декабря 19:00 – 22:00</div>
      <div class="meta"><span>D&amp;D 5e · Ваншот</span><span class="price">2000р</span></div>
    </div>
  </div>
  <div class="feature-card">
    <div class="ico">⚔️</div>
    <h4>Заявки в один тап</h4>
    <p>Подай заявку — мастер одобрит, и ты в партии. Мест нет? Вейтлист сам подвинет тебя вперёд.</p>
  </div>
</div>
